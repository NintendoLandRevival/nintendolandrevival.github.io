<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mods</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #6e8efb 0%, #a777e3 25%, #6e8efb 50%, #a777e3 75%, #6e8efb 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        #logo {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        #logo img {
            width: 50px; /* Adjust size as needed */
            height: auto;
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            margin-bottom: 40px;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            width: 550px;
            height: 650px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .sidebar::-webkit-scrollbar {
            display: none;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .entries-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .entry {
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 10px;
            border-radius: 8px;
        }

        .entry:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .entry.hidden {
            display: none;
        }

        .entry img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .entry-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            word-wrap: break-word;
        }

        .entry h3 {
            color: #fff;
            margin: 0;
            font-size: 20px;
            word-wrap: break-word;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            border: 3px solid rgba(128, 128, 128, 0.9);
            background: linear-gradient(45deg, rgba(255, 230, 230, 0.9), rgba(230, 255, 230, 0.9), rgba(230, 230, 255, 0.9), rgba(255, 255, 230, 0.9), rgba(255, 230, 255, 0.9));
            border-radius: 50px;
            font-size: 18px;
            color: #666;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .description {
            width: 600px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
            height: 650px;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .description::-webkit-scrollbar {
            display: none;
        }

        .description.fade-out {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .description .line {
            opacity: 0;
            animation: fadeInLine 0.6s ease forwards;
        }

        @keyframes fadeInLine {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .description h2 {
            margin-top: 0;
            color: #fff;
            font-size: 24px;
        }

        .description p {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .description img {
            width: 100%;
            height: auto;
            margin-top: 15px;
            border-radius: 10px;
            display: block;
        }

        .play-button {
            display: inline-block;
            padding: 15px 30px;
            border: 3px solid rgba(128, 128, 128, 0.9);
            background: linear-gradient(45deg, rgba(255, 230, 230, 0.9), rgba(230, 255, 230, 0.9), rgba(230, 230, 255, 0.9), rgba(255, 255, 230, 0.9), rgba(255, 230, 255, 0.9));
            border-radius: 50px;
            font-size: 20px;
            color: #666;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease, padding 0.3s ease;
            white-space: nowrap;
        }

        .play-button:hover {
            transform: scale(1.05);
            padding: 18px 36px;
        }

        .play-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<!-- CHANGE THIS -->
<body>
    <div id="logo">
        <img src="images/button1.png" alt="Button 1">
    </div>
    <div class="content">
        <div class="sidebar">
            <input type="text" class="search-bar" placeholder="Search mods..." id="search-input">
            <div class="entries-grid">
                <div class="entry" data-mod="1">
                    <img src="images/mods/toadette.png" alt="Cool Mod">
                    <div class="entry-content">
                        <h3>Toadette</h3>
                        <a href="download1.zip" class="download-btn" download>⤓ Download</a>
                    </div>
                </div>
                <div class="entry" data-mod="2">
                    <img src="https://via.placeholder.com/280x100/a777e3/ffffff?text=Awesome+Mod" alt="Awesome Mod">
                    <div class="entry-content">
                        <h3>Awesome Mod</h3>
                        <a href="download2.zip" class="download-btn" download>⤓ Download</a>
                    </div>
                </div>
                <div class="entry" data-mod="3">
                    <img src="https://via.placeholder.com/280x100/6e8efb/ffffff?text=Ultimate+Mod" alt="Ultimate Mod">
                    <div class="entry-content">
                        <h3>Ultimate Mod</h3>
                        <a href="download3.zip" class="download-btn" download>⤓ Download</a>
                    </div>
                </div>
                <div class="entry" data-mod="4">
                    <img src="https://via.placeholder.com/280x100/6e8efb/ffffff?text=Ultimate+Mod" alt="Ultimate Mod">
                    <div class="entry-content">
                        <h3>Ultimates Mod</h3>
                        <a href="download3.zip" class="download-btn" download>⤓ Download</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="description" id="mod-description">
            <h2>Welcome to the Mod Page!</h2>
            <p>Select a mod from the sidebar to view its description.</p>
        </div>
    </div>
    <button class="play-button" onclick="window.location.href='index.html'">Back to Homepage</button>
    <script>
        const modDescriptions = {
            1: {
                title: 'Toadette',
                content: '<p>This mod for Mario Chase makes the 2nd toad skin, (the pink one) into Toadette!</p><p>Author: Jonahanoj | Wii U Compatibility: Compatible</p>',
                image: 'images/mods/toadettedesc.png'
            },
            2: {
                title: 'Awesome Mod',
                content: '<p>An awesome collection of tools and assets that make your game more enjoyable. Includes custom sounds, textures, and UI improvements.</p><p>Author: | Wii U Compatibility:</p>',
                image: 'https://via.placeholder.com/600x300/a777e3/ffffff?text=Awesome+Mod+Screenshot'
            },
            3: {
                title: 'Ultimate Mod',
                content: '<p>The ultimate mod pack with everything you need: new levels, characters, and storylines. Transform your game completely!</p><p>Author: | Wii U Compatibility:</p>',
                image: 'https://via.placeholder.com/600x300/6e8efb/ffffff?text=Ultimate+Mod+Screenshot'
            },
            4: {
                title: 'Ultimates Mod',
                content: '<p>The ultimate mod pack with everything you need: new levels, characters, and storylines. Transform your game completely!</p><p>Author: | Wii U Compatibility:</p>',
                image: 'https://via.placeholder.com/600x300/6e8efb/ffffff?text=Ultimates+Mod+Screenshot'
            },
        };

        document.addEventListener('DOMContentLoaded', () => {
            const entries = document.querySelectorAll('.entry');
            const description = document.getElementById('mod-description');
            const searchInput = document.getElementById('search-input');

            function revealLines(container) {
                const lines = container.querySelectorAll('h2, p, img');
                lines.forEach((line, index) => {
                    line.style.animationDelay = `${index * 0.2}s`;
                    line.classList.add('line');
                });
            }

            entries.forEach(entry => {
                entry.addEventListener('click', () => {
                    const modId = entry.dataset.mod;
                    const mod = modDescriptions[modId];
                    if (mod) {
                        description.classList.add('fade-out');
                        setTimeout(() => {
                            const imageHtml = mod.image ? `<img src="${mod.image}" alt="${mod.title} Image">` : '';
                            description.innerHTML = `<h2>${mod.title}</h2>${mod.content}${imageHtml}`;
                            description.classList.remove('fade-out');
                            // Trigger reflow
                            description.offsetHeight;
                            revealLines(description);
                        }, 300);
                    }
                });
            });

            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                entries.forEach(entry => {
                    const title = entry.querySelector('h3').textContent.toLowerCase();
                    if (title.includes(searchTerm)) {
                        entry.classList.remove('hidden');
                    } else {
                        entry.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>

</html>
